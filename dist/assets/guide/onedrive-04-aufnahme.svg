  <text x="529" y="408" fill="#7a4d00" font-family="Segoe UI,Arial" font-size="18" font-weight="750">Bei Schatten oder Spiegelung</text>
  <text x="529" y="443" fill="#654c25" font-family="Segoe UI,Arial" font-size="17">Wechseln Sie den Platz. Ein Filter kann</text>
  <text x="529" y="472" fill="#654c25" font-family="Segoe UI,Arial" font-size="17">schlechtes Licht nicht vollständig retten.</text>
  <circle cx="877" cy="102" r="26" fill="#087ea4"/>
