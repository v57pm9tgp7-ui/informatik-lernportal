  <rect x="105" y="493" width="96" height="34" rx="17" fill="#087a69"/>
  <text x="153" y="516" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial" font-size="15" font-weight="750">Dokument</text>
  <circle cx="247" cy="545" r="34" fill="none" stroke="#fff" stroke-width="6"/>
  <circle cx="247" cy="545" r="25" fill="#fff"/>
  <text x="505" y="151" fill="#10263a" font-family="Segoe UI,Arial" font-size="31" font-weight="750">Blatt vollständig zeigen</text>
