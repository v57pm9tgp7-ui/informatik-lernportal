<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Ein Dokument gerade aufnehmen</title>
  <desc id="desc">Schematische Kameraansicht mit einem vollständigen Blatt und markierten Ecken.</desc>
  <rect width="960" height="640" rx="36" fill="#e9f3f4"/>
  <rect x="54" y="28" width="386" height="584" rx="42" fill="#10263a"/>
  <rect x="68" y="42" width="358" height="556" rx="31" fill="#20383b"/>
  <rect x="186" y="51" width="122" height="17" rx="8" fill="#10263a"/>
  <circle cx="106" cy="104" r="21" fill="#ffffff22"/>
  <path d="M100 104h12M106 98v12" stroke="#fff" stroke-width="3"/>
  <circle cx="389" cy="104" r="21" fill="#ffffff22"/>
  <path d="M383 99l12 10M395 99l-12 10" stroke="#fff" stroke-width="3"/>
  <rect x="114" y="145" width="266" height="326" rx="8" fill="#fffef7" transform="rotate(-1 247 308)"/>
  <text x="149" y="196" fill="#243b4d" font-family="Segoe UI,Arial" font-size="22" font-weight="750">Tagesausflug</text>
  <path d="M149 226h186M149 252h168M149 278h178M149 304h152M149 330h183M149 356h164M149 382h175" stroke="#8295a0" stroke-width="7" stroke-linecap="round"/>
