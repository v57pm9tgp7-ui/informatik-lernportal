<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">HP 705 Rechargeable Multi Pen – schwarzer DigiPen</title>
  <desc id="desc">Schematische Darstellung des schlanken schwarzen HP 705 mit USB-C-Anschluss, zwei Seitentasten und Spitze.</desc>
  <defs>
    <linearGradient id="body" x1="0" x2="1">
      <stop offset="0" stop-color="#17222c"/>
      <stop offset="0.48" stop-color="#344452"/>
      <stop offset="1" stop-color="#0d151c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#08243d" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="960" height="560" rx="34" fill="#f5fbff"/>
  <text x="56" y="70" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#087fce">SCHLANK UND SCHWARZ</text>
  <text x="56" y="116" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#08243d">HP 705 Rechargeable Multi Pen</text>
  <text x="56" y="151" font-family="Arial, sans-serif" font-size="21" fill="#496174">2 Seitentasten · USB-C · nicht im Bluetooth-Menü suchen</text>

  <g transform="translate(75 245) rotate(6 400 45)" filter="url(#shadow)">
    <rect x="58" y="26" width="700" height="54" rx="27" fill="url(#body)" stroke="#0a1117" stroke-width="2"/>
    <path d="M758 26 L854 53 L758 80 Z" fill="url(#body)" stroke="#0a1117" stroke-width="2"/>
    <path d="M854 53 l35 0" stroke="#111b23" stroke-width="9" stroke-linecap="round"/>
    <rect x="302" y="38" width="82" height="18" rx="9" fill="#778997" stroke="#a8b5bf" stroke-width="1.5"/>
    <rect x="397" y="38" width="82" height="18" rx="9" fill="#778997" stroke="#a8b5bf" stroke-width="1.5"/>
    <rect x="34" y="34" width="54" height="38" rx="13" fill="#1b2933" stroke="#5b6e7d" stroke-width="2"/>
    <rect x="49" y="43" width="31" height="17" rx="6" fill="#070b0f" stroke="#8597a4" stroke-width="1.5"/>
  </g>

  <g font-family="Arial, sans-serif">
    <path d="M156 221 C149 192 149 176 149 160" fill="none" stroke="#087fce" stroke-width="4"/>
    <circle cx="149" cy="159" r="7" fill="#087fce"/>
    <text x="73" y="191" font-size="22" font-weight="700" fill="#08243d">USB-C</text>
    <text x="73" y="217" font-size="18" fill="#496174">zum Laden</text>

    <path d="M458 278 C462 229 477 204 484 187" fill="none" stroke="#087fce" stroke-width="4"/>
    <circle cx="484" cy="187" r="7" fill="#087fce"/>
    <text x="421" y="181" font-size="22" font-weight="700" fill="#08243d">2 Seitentasten</text>
    <text x="421" y="207" font-size="18" fill="#496174">bei Problemen beide 5 Sek. drücken</text>

    <path d="M850 328 C884 345 898 369 900 389" fill="none" stroke="#087fce" stroke-width="4"/>
    <circle cx="900" cy="390" r="7" fill="#087fce"/>
    <text x="744" y="430" font-size="22" font-weight="700" fill="#08243d">Spitze</text>
    <text x="744" y="456" font-size="18" fill="#496174">direkt in OneNote testen</text>
  </g>

  <rect x="80" y="459" width="830" height="66" rx="18" fill="#e7f5ff" stroke="#aad8f7"/>
  <text x="104" y="489" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#08243d">Wichtig: Keine Bluetooth-Kopplung nötig.</text>
  <text x="104" y="514" font-family="Arial, sans-serif" font-size="18" fill="#496174">Wenn der Stift nicht schreibt: beide Seitentasten gleichzeitig 5 Sekunden drücken.</text>
</svg>