<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Den Scan zuschneiden und prüfen</title>
  <desc id="desc">Schematische Bearbeitungsansicht mit den Werkzeugen Zuschneiden, Drehen, Filter und Hinzufügen.</desc>
  <rect width="960" height="640" rx="36" fill="#eef7f5"/>
  <rect x="54" y="28" width="386" height="584" rx="42" fill="#10263a"/>
  <rect x="68" y="42" width="358" height="556" rx="31" fill="#fff"/>
  <rect x="186" y="51" width="122" height="17" rx="8" fill="#10263a"/>
  <text x="92" y="109" fill="#10263a" font-family="Segoe UI,Arial" font-size="23" font-weight="750">Vorschau</text>
  <text x="376" y="109" text-anchor="end" fill="#087a69" font-family="Segoe UI,Arial" font-size="17" font-weight="750">Fertig</text>
  <rect x="112" y="137" width="270" height="315" rx="8" fill="#eff3ed" stroke="#9baeb5"/>
  <rect x="139" y="159" width="216" height="270" rx="4" fill="#fffef8"/>
  <text x="164" y="201" fill="#243b4d" font-family="Segoe UI,Arial" font-size="18" font-weight="750">Tagesausflug</text>
  <path d="M164 227h165M164 250h143M164 273h158M164 296h137M164 319h163M164 342h151M164 365h159" stroke="#8798a0" stroke-width="6" stroke-linecap="round"/>
  <g font-family="Segoe UI,Arial" font-size="13" font-weight="650" fill="#294454" text-anchor="middle">
    <rect x="83" y="477" width="78" height="67" rx="12" fill="#edf5f7"/><text x="122" y="519">Zuschnitt</text>
    <rect x="170" y="477" width="70" height="67" rx="12" fill="#edf5f7"/><text x="205" y="519">Drehen</text>
    <rect x="249" y="477" width="70" height="67" rx="12" fill="#edf5f7"/><text x="284" y="519">Filter</text>
    <rect x="328" y="477" width="78" height="67" rx="12" fill="#e6f5f1"/><text x="367" y="519">+ Seite</text>
  </g>
  <circle cx="877" cy="102" r="26" fill="#087ea4"/>
  <text x="877" y="111" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial" font-size="22" font-weight="800">5</text>
  <text x="505" y="151" fill="#10263a" font-family="Segoe UI,Arial" font-size="31" font-weight="750">Vor dem Speichern prüfen</text>
  <g font-family="Segoe UI,Arial" font-size="20" fill="#38536a">
    <text x="505" y="205">1. Ecken genau an die Blattränder</text>
    <text x="505" y="244">2. Text aufrecht drehen</text>
    <text x="505" y="283">3. Filter nur bei besserer Lesbarkeit</text>
    <text x="505" y="322">4. Bei Bedarf weitere Seite anfügen</text>
  </g>
  <rect x="505" y="370" width="392" height="125" rx="20" fill="#e6f5f1" stroke="#78b8aa"/>
  <text x="529" y="409" fill="#075b4d" font-family="Segoe UI,Arial" font-size="18" font-weight="750">Kurztest</text>
  <text x="529" y="443" fill="#264f49" font-family="Segoe UI,Arial" font-size="17">Zoomen Sie auf die kleinste Schrift.</text>
  <text x="529" y="472" fill="#264f49" font-family="Segoe UI,Arial" font-size="17">Ist sie scharf, können Sie speichern.</text>
  <text x="505" y="560" fill="#496475" font-family="Segoe UI,Arial" font-size="15">Schematische Darstellung · App-Versionen können abweichen</text>
</svg>
