<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Beispiel für Texterkennung bei einem Infozettel</title>
  <desc id="desc">Links steht ein gescannter Infozettel zu einem Filmquiz, in der Mitte die Texterkennung und rechts eine kurze Nachricht mit den wichtigsten Angaben.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#092f45" flood-opacity=".13"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#087a69"/>
    </marker>
  </defs>
  <rect width="1200" height="700" rx="32" fill="#eef7f6"/>
  <text x="56" y="60" fill="#0b2940" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Vom Papier zur brauchbaren Nachricht</text>
  <text x="56" y="94" fill="#496677" font-family="Segoe UI, Arial, sans-serif" font-size="18">Texterkennung übernimmt den Text. Sie kontrollieren die wichtigen Angaben.</text>

  <g filter="url(#shadow)">
    <rect x="56" y="135" width="320" height="485" rx="22" fill="#ffffff" stroke="#b8d2d5" stroke-width="2"/>
  </g>
  <rect x="78" y="157" width="276" height="52" rx="13" fill="#082b43"/>
  <text x="216" y="191" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">FILMQUIZ</text>
  <text x="90" y="255" fill="#0b2940" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Samstag, 19. September</text>
  <text x="90" y="293" fill="#0b2940" font-family="Segoe UI, Arial, sans-serif" font-size="21">Beginn: 18.30 Uhr</text>
  <text x="90" y="331" fill="#0b2940" font-family="Segoe UI, Arial, sans-serif" font-size="21">Ort: Jugendtreff</text>
  <text x="90" y="369" fill="#0b2940" font-family="Segoe UI, Arial, sans-serif" font-size="21">Eintritt: Fr. 5.–</text>
  <line x1="90" y1="400" x2="342" y2="400" stroke="#d6e4e6" stroke-width="2"/>
  <text x="90" y="444" fill="#087a69" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Mitbringen:</text>
  <text x="90" y="480" fill="#0b2940" font-family="Segoe UI, Arial, sans-serif" font-size="21">Smartphone</text>
  <text x="90" y="516" fill="#0b2940" font-family="Segoe UI, Arial, sans-serif" font-size="21">und gute Laune</text>
  <rect x="88" y="552" width="254" height="42" rx="10" fill="#fff2cc"/>
  <text x="215" y="579" text-anchor="middle" fill="#6a4c00" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">1  Zettel scannen</text>

  <line x1="400" y1="360" x2="515" y2="360" stroke="#087a69" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <circle cx="458" cy="317" r="30" fill="#087a69"/>
  <text x="458" y="326" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">2</text>
  <text x="458" y="415" text-anchor="middle" fill="#0b2940" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Text aus Bild</text>
  <text x="458" y="439" text-anchor="middle" fill="#0b2940" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">kopieren</text>

  <g filter="url(#shadow)">
    <rect x="545" y="170" width="600" height="410" rx="24" fill="#ffffff" stroke="#b8d2d5" stroke-width="2"/>
  </g>
  <rect x="575" y="200" width="540" height="52" rx="13" fill="#e2f4f0"/>
  <text x="600" y="234" fill="#075b4d" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">GRUPPENCHAT</text>
  <rect x="607" y="286" width="468" height="205" rx="22" fill="#d9f7e8"/>
  <text x="638" y="329" fill="#0b2940" font-family="Segoe UI, Arial, sans-serif" font-size="22">Am Samstag, 19. September,</text>
  <text x="638" y="365" fill="#0b2940" font-family="Segoe UI, Arial, sans-serif" font-size="22">findet um 18.30 Uhr im Jugendtreff</text>
  <text x="638" y="401" fill="#0b2940" font-family="Segoe UI, Arial, sans-serif" font-size="22">das Filmquiz statt. Eintritt: 5 Franken.</text>
  <text x="638" y="437" fill="#0b2940" font-family="Segoe UI, Arial, sans-serif" font-size="22">Bringt euer Smartphone mit.</text>
  <text x="1088" y="470" text-anchor="end" fill="#496677" font-family="Segoe UI, Arial, sans-serif" font-size="16">18:02  ✓✓</text>
  <rect x="575" y="513" width="540" height="42" rx="10" fill="#fff2cc"/>
  <text x="845" y="540" text-anchor="middle" fill="#6a4c00" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">3  Zahlen und Angaben kontrollieren</text>
</svg>
