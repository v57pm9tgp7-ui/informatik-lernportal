<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>Berufsporträt Logistiker/in EFZ, überarbeitet</title><rect width="1400" height="900" fill="#f4f1e8"/><rect x="0" y="0" width="440" height="900" rx="0" fill="#173b56" stroke="none" stroke-width="2"/><text x="45" y="80" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#d9c9a0">MEIN LEHRBERUF</text><text x="45" y="210.0" font-family="Arial,sans-serif" font-size="57" font-weight="700" fill="#ffffff">Logistiker/in</text><text x="45" y="289.8" font-family="Arial,sans-serif" font-size="57" font-weight="700" fill="#ffffff">EFZ</text><text x="45" y="400.0" font-family="Arial,sans-serif" font-size="35" font-weight="400" fill="#ffffff">Fachrichtung</text><text x="45" y="449.0" font-family="Arial,sans-serif" font-size="35" font-weight="400" fill="#ffffff">Lager</text><rect x="45" y="605" width="350" height="155" rx="12" fill="#eacb72" stroke="none" stroke-width="2"/><text x="65" y="666" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#173b56">3 Jahre</text><text x="65" y="717" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#173b56">bis zum EFZ</text><text x="500" y="100" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#173b56">Was mache ich?</text><text x="500" y="165" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#24364b">Waren annehmen und kontrollieren.</text><text x="500" y="213" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#24364b">Waren richtig einlagern.</text><text x="500" y="261" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#24364b">Bestellungen für den Versand vorbereiten.</text><text x="500" y="365" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#173b56">Wo arbeite ich?</text><text x="500" y="428.0" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#24364b">Zum Beispiel in Lagerhallen und</text><text x="500" y="470.0" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#24364b">Verteilzentren.</text><text x="500" y="600" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#173b56">Was hilft mir dabei?</text><text x="500" y="663" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#24364b">Systematisch und sorgfältig arbeiten.</text><text x="500" y="709" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#24364b">Im Team arbeiten und körperlich belastbar sein.</text><text x="500" y="850" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#24364b">Quelle: berufsberatung.ch · Logistiker/in EFZ · 02.11.2026</text></svg>