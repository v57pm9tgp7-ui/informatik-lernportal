<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img"><title>WWF Schweiz: unübersichtliches Ausgangsplakat</title><rect width="900" height="1200" fill="#dbe7ee"/><circle cx="450" cy="310" r="260" fill="#b7d0d8"/><circle cx="390" cy="265" r="60" fill="#82a5b0"/><circle cx="600" cy="380" r="95" fill="#829aaa"/><text x="120" y="400" font-family="Arial,sans-serif" font-size="140" font-weight="700" fill="#dae6eb">NATUR</text><text x="540" y="635" font-family="Georgia,sans-serif" font-size="27" font-weight="400" fill="#6c8995">WWF Schweiz</text><text x="45" y="800" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#77919d">Einen lebenswerten Planeten für kommende Generationen erhalten.</text><text x="45" y="825" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#77919d">Wälder und Meere schützen, Arten erhalten, Klima schützen.</text><text x="45" y="850" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#77919d">Bildung und Zusammenarbeit mit Wirtschaft, Finanzwesen und Politik.</text><text x="65" y="1020" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#77919d">PORTRÄT EINER NGO</text><text x="50" y="1140" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#6f8a96">Quelle: wwf.ch · Über den WWF Schweiz · 02.11.2026</text><text x="50" y="1165" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#6f8a96">Unterrichtsporträt, keine offizielle WWF-Publikation.</text></svg>