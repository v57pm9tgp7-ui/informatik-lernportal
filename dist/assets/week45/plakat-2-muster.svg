<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img"><title>WWF Schweiz: überarbeitetes NGO-Porträt</title><rect width="900" height="1200" fill="#edf3e8"/><text x="55" y="75" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#526d48">PORTRÄT EINER NGO</text><text x="55" y="165" font-family="Arial,sans-serif" font-size="67" font-weight="700" fill="#173e31">WWF Schweiz</text><text x="55" y="260" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#173e31">Natur schützen.</text><text x="55" y="324" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#173e31">Zukunft ermöglichen.</text><rect x="55" y="405" width="790" height="155" rx="12" fill="#173e31" stroke="none" stroke-width="2"/><text x="80" y="453" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#bcd3aa">DAS ZIEL</text><text x="80" y="502.0" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#ffffff">Einen lebenswerten Planeten für</text><text x="80" y="544.0" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#ffffff">kommende Generationen erhalten.</text><text x="55" y="650" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#173e31">Daran arbeitet der WWF</text><text x="65" y="725" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#5e7f4e">01</text><text x="135" y="725" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#173e31">Wälder und Meere schützen</text><text x="65" y="798" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#5e7f4e">02</text><text x="135" y="798" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#173e31">Arten erhalten</text><text x="65" y="871" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#5e7f4e">03</text><text x="135" y="871" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#173e31">Das Klima schützen</text><text x="55" y="1000" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#173e31">So geht die Organisation vor</text><text x="55" y="1055.0" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#173e31">Bildung und Zusammenarbeit mit Wirtschaft,</text><text x="55" y="1094.2" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#173e31">Finanzwesen und Politik.</text><text x="55" y="1150" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#52654c">Quelle: wwf.ch · Über den WWF Schweiz · 02.11.2026</text><text x="55" y="1176" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#52654c">Unterrichtsporträt, keine offizielle WWF-Publikation.</text></svg>