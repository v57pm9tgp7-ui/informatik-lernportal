<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1100" viewBox="0 0 1100 1100" role="img"><title>Atmungssystem: Ausgangsplakat ohne klare Leserichtung</title><rect width="1100" height="1100" fill="#f7e7ee"/><rect x="40" y="40" width="1020" height="160" rx="0" fill="#bd4c74" stroke="none" stroke-width="2"/><text x="65" y="135" font-family="Georgia,sans-serif" font-size="49" font-weight="700" fill="#ffffff">WAS PASSIERT IM KÖRPER?</text><rect x="45" y="240" width="365" height="210" rx="0" fill="#e0d1e5" stroke="none" stroke-width="2"/><text x="65" y="295" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#614565">Sauerstoff gelangt aus</text><text x="65" y="339" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#614565">den Lungenbläschen</text><text x="65" y="383" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#614565">ins Blut.</text><rect x="515" y="300" width="530" height="90" rx="0" fill="#e6b7c5" stroke="none" stroke-width="2"/><text x="535" y="357" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#943c60">DAS ATMUNGSSYSTEM</text><text x="400" y="530" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#6d496e">Nase/Mund → Luftröhre → Bronchien</text><text x="400" y="565" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#6d496e">→ Lungenbläschen</text><rect x="610" y="670" width="440" height="190" rx="0" fill="#c6b3d6" stroke="none" stroke-width="2"/><text x="635" y="722.0" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#503c6a">Das Zwerchfell hilft,</text><text x="635" y="762.6" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#503c6a">den Brustraum beim</text><text x="635" y="803.2" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#503c6a">Atmen zu bewegen.</text><text x="65" y="810" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#9d365a">Kohlendioxid gelangt aus</text><text x="65" y="860" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#9d365a">dem Blut in die</text><text x="65" y="910" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#9d365a">Lungenbläschen.</text><text x="440" y="990" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#7c5974">Kohlendioxid wird anschliessend ausgeatmet.</text><text x="40" y="1055" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#7c5974">Quelle: gesundheitsinformation.de · Wie funktioniert die Lunge? · 02.11.2026</text></svg>