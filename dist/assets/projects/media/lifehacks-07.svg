<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img"><title>Von einem Versprechen zu einem Nutzen</title><desc>Schreiben Sie, was bei Ihrem Test tatsächlich besser ging. Vermeiden Sie erfundene Zeitersparnisse. Prüfen Sie einen Tipp zusätzlich mit einer anderen Person.</desc><rect width="1280" height="720" fill="#eef3f7"/><rect x="0" y="0" width="1280" height="155" rx="0" fill="#102e44"/><text x="40" y="44.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#bfd7e5">MEDIENINFOLAB  /  Fünf Tricks, die bleiben</text><text x="1140" y="43.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#bfd7e5">07 / 08</text><text x="40" y="106.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="40" font-weight="700" fill="#ffffff">Von einem Versprechen zu einem Nutzen</text><rect x="40" y="181" width="386" height="359" rx="16" fill="#ffffff" stroke="#d3dee6" stroke-width="2"/><rect x="40" y="181" width="7" height="359" rx="3" fill="#b15b47"/><rect x="62" y="201" width="49" height="44" rx="12" fill="#b15b47"/><text x="72" y="230.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#ffffff">01</text><text x="64" y="284.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" fill="#18364c">Zu ungenau</text><text x="64" y="361.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400" fill="#466072">«Dieser Trick spart mega</text><text x="64" y="395.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400" fill="#466072">viel Zeit.»</text><rect x="447" y="181" width="386" height="359" rx="16" fill="#ffffff" stroke="#d3dee6" stroke-width="2"/><rect x="447" y="181" width="7" height="359" rx="3" fill="#b15b47"/><rect x="469" y="201" width="49" height="44" rx="12" fill="#b15b47"/><text x="479" y="230.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#ffffff">02</text><text x="471" y="284.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" fill="#18364c">Nachvollziehbar</text><text x="471" y="361.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400" fill="#466072">«Ich finde den</text><text x="471" y="395.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400" fill="#466072">Abgabetermin direkt über</text><text x="471" y="429.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400" fill="#466072">den markierten Treffer.»</text><rect x="854" y="181" width="386" height="359" rx="16" fill="#ffffff" stroke="#d3dee6" stroke-width="2"/><rect x="854" y="181" width="7" height="359" rx="3" fill="#b15b47"/><rect x="876" y="201" width="49" height="44" rx="12" fill="#b15b47"/><text x="886" y="230.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#ffffff">03</text><text x="878" y="284.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" fill="#18364c">Test zu zweit</text><text x="878" y="361.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400" fill="#466072">Die Person führt den Tipp</text><text x="878" y="395.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400" fill="#466072">nur mit Ihrer Karte aus.</text><rect x="40" y="566" width="1200" height="92" rx="14" fill="#102e44"/><text x="62" y="597.8" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#a8d5d4">DARUM FUNKTIONIERT ES</text><text x="62" y="631.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#ffffff">Eine konkrete Beobachtung ist überzeugender als ein grosses Versprechen.</text><text x="40" y="698.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#466072">Eigenes Beispiel · übertragen, ausprobieren, verbessern</text><text x="1058" y="698.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#466072">Ohne Sprecherstimme</text></svg>