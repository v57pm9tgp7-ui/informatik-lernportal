<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img"><title>Beispiel 1 · Schule im Griff</title><desc>Dieses Schulbeispiel enthält drei Aufgaben, zwei erfundene Termine, drei Linknamen und ein Ziel. Übernehmen Sie echte Termine nur aus Ihrer Quelle.</desc><rect width="1280" height="720" fill="#eef3f7"/><rect x="0" y="0" width="1280" height="155" rx="0" fill="#102e44"/><text x="40" y="44.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#bfd7e5">MEDIENINFOLAB  /  Mein digitales Cockpit</text><text x="1140" y="43.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#bfd7e5">02 / 07</text><text x="40" y="106.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="40" font-weight="700" fill="#ffffff">Beispiel 1 · Schule im Griff</text><rect x="40" y="181" width="590" height="169" rx="16" fill="#ffffff" stroke="#d3dee6" stroke-width="2"/><rect x="40" y="181" width="7" height="169" rx="3" fill="#187d72"/><text x="64" y="222.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#18364c">Meine Aufgaben</text><text x="64" y="263.8" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#466072">ZUERST · Scan öffnen und prüfen</text><text x="64" y="292.8" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#466072">Tutorial-Bilder ergänzen</text><text x="64" y="320.8" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#466072">Quellenlinks kontrollieren</text><rect x="650" y="181" width="590" height="169" rx="16" fill="#ffffff" stroke="#d3dee6" stroke-width="2"/><rect x="650" y="181" width="7" height="169" rx="3" fill="#187d72"/><text x="674" y="222.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#18364c">Termine · Übung</text><text x="674" y="264.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#466