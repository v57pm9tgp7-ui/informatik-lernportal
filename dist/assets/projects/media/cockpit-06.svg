<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img"><title>Der 10-Sekunden-Test</title><desc>Schliessen und öffnen Sie die OneNote-Seite. Finden Sie Aufgabe, Termin und Link jeweils in etwa zehn Sekunden. Das ist ein Testziel, keine Geschwindigkeitsnote.</desc><rect width="1280" height="720" fill="#eef3f7"/><rect x="0" y="0" width="1280" height="155" rx="0" fill="#102e44"/><text x="40" y="44.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#bfd7e5">MEDIENINFOLAB  /  Mein digitales Cockpit</text><text x="1140" y="43.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#bfd7e5">06 / 07</text><text x="40" y="106.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="40" font-weight="700" fill="#ffffff">Der 10-Sekunden-Test</text><rect x="40" y="181" width="386" height="359" rx="16" fill="#ffffff" stroke="#d3dee6" stroke-width="2"/><rect x="40" y="181" width="7" height="359" rx="3" fill="#187d72"/><rect x="62" y="201" width="49" height="44" rx="12" fill="#187d72"/><text x="72" y="230.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#ffffff">01</text><text x="64" y="284.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" fill="#18364c">Nächste Aufgabe?</text><text x="64" y="361.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400" fill="#466072">Das Wort ZUERST fällt</text><text x="64" y="395.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400" fill="#466072">direkt auf.</text><rect x="447" y="181" width="386" height="359" rx="16" fill="#ffffff" stroke="#d3dee6" stroke-width="2"/><rect x="447" y="181" width="7" height="359" rx="3" fill="#187d72"/><rect x="469" y="201" width="49" height="44" rx="12" fill="#187d72"/><text x="479" y="230.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#ffffff">02</text><text x="471" y="284.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" fill="#18364c">Nächster Termin?</text><text x="471" y="361.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400" fill="#466072">Datum und Anlass stehen</text><text x="471" y="395.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400" fill="#466072">zusammen.</text><rect x="854" y="181" width="386" height="359" rx="16" fill="#ffffff" stroke="#d3dee6" stroke-width="2"/><rect x="854" y="181" width="7" height="359" rx="3" fill="#187d72"/><rect x="876" y="201" width="49" height="44" rx="12" fill="#187d72"/><text x="886" y="230.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#ffffff">03</text><text x="878" y="284.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" fill="#18364c">Benötigte Datei?</text><text x="878" y="361.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400" fill="#466072">Der benannte Link führt</text><text x="878" y="395.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400" fill="#466072">zum richtigen Ort.</text><rect x="40" y="566" width="1200" height="92" rx="14" fill="#102e44"/><text x="62" y="597.8" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#a8d5d4">DARUM FUNKTIONIERT ES</text><text x="62" y="631.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#ffffff">Die langsamste Stelle zeigt Ihnen, was Sie verbessern sollten.</text><text x="40" y="698.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#466072">Eigenes Beispiel · übertragen, ausprobieren, verbessern</text><text x="1058" y="698.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#466072">Ohne Sprecherstimme</text></svg>