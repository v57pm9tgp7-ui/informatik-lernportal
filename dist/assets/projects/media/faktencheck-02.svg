<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img"><title>Beispiel 1 · «Inkognito = unsichtbar»</title><desc>Google und Mozilla erklären: Privates Surfen beschränkt lokale Spuren, macht aber nicht anonym. Die genaue Funktionsweise hängt vom Browser ab. Die Quellen sind unter dem Video verlinkt.</desc><rect width="1280" height="720" fill="#eef3f7"/><rect x="0" y="0" width="1280" height="155" rx="0" fill="#102e44"/><text x="40" y="44.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#bfd7e5">MEDIENINFOLAB  /  Echt oder Fake?</text><text x="1140" y="43.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#bfd7e5">02 / 07</text><text x="40" y="106.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="40" font-weight="700" fill="#ffffff">Beispiel 1 · «Inkognito = unsichtbar»</text><rect x="40" y="181" width="605" height="168" rx="16" fill="#ffffff" stroke="#d3dee6" stroke-width="2"/><rect x="40" y="181" width="7" height="168" rx="3" fill="#aa7623"/><text x="64" y="222.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#18364c">Google · Chrome-Hilfe</text><text x="64" y="264.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#466072">Websites und Netzwerkbetreiber können</text><text x="64" y="294.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#466072">Aktivitäten möglicherweise beobachten.</text><rect x="40" y="370" width="605" height="170" rx="16" fill="#ffffff" stroke="#d3dee6" stroke-width="2"/><rect x="40" y="370" width="7" height="170" rx="3" fill="#aa7623"/><text x="64" y="411.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#18364c">Mozilla · Firefox-Hilfe</text><text x="64" y="453.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#466072">Privater Modus macht im Internet nicht</text><text x="64" y="483.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#466072">anonym.</text><rect x="671" y="181" width="569" height="359" rx="16" fill="#ffffff" stroke="#d3dee6" stroke-width="2"/><rect x="671" y="181" width="7" height="359" rx="3" fill="#aa7623"/><rect x="693" y="201" width="49" height="44" rx="12" fill="#aa7623"/><text x="703" y="230.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#ffffff">03</text><text x="695" y="284.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" fill="#18364c">Begründetes Urteil</text><text x="695" y="361.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400" fill="#466072">Die pauschale Behauptung ist falsch:</text><text x="695" y="395.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400" fill="#466072">weniger lokale Spuren bedeutet nicht</text><text x="695" y="429.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400" fill="#466072">unsichtbar.</text><polyline points="630,280 687,280" fill="none" stroke="#aa7623" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="677,271 687,280 677,289" fill="none" stroke="#aa7623" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="630,450 687,450" fill="none" stroke="#aa7623" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="677,441 687,450 677,459" fill="none" stroke="#aa7623" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="566" width="1200" height="92" rx="14" fill="#102e44"/><text x="62" y="597.8" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#a8d5d4">DARUM FUNKTIONIERT ES</text><text x="62" y="631.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#ffffff">Die Begründung nennt beide Belege und unterscheidet lokal von online.</text><text x="40" y="698.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#466072">Eigenes Beispiel · übertragen, ausprobieren, verbessern</text><text x="1020" y="698.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#466072">KI-Sprecherin · Deutsch</text></svg>