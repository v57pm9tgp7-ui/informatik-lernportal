<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img"><title>Klar gestalten, ehrlich urteilen</title><desc>Eine gute Faktencheck-Karte trennt Behauptung, Belege, Urteil und Quellen. Die Quellenlinks und die Einschränkung bleiben auch in einer kurzen Fassung sichtbar.</desc><rect width="1280" height="720" fill="#eef3f7"/><rect x="0" y="0" width="1280" height="155" rx="0" fill="#102e44"/><text x="40" y="44.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#bfd7e5">MEDIENINFOLAB  /  Echt oder Fake?</text><text x="1140" y="43.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#bfd7e5">06 / 07</text><text x="40" y="106.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="40" font-weight="700" fill="#ffffff">Klar gestalten, ehrlich urteilen</text><rect x="40" y="181" width="590" height="169" rx="16" fill="#ffffff" stroke="#d3dee6" stroke-width="2"/><rect x="40" y="181" width="7" height="169" rx="3" fill="#aa7623"/><text x="64" y="222.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#18364c">Behauptung</text><text x="64" y="264.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#466072">Ein genauer Satz.</text><rect x="650" y="181" width="590" height="169" rx="16" fill="#ffffff" stroke="#d3dee6" stroke-width="2"/><rect x="650" y="181" width="7" height="169" rx="3" fill="#aa7623"/><text x="674" y="222.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#18364c">Belege</text><text x="674" y="264.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#466072">Quelle 1 und Quelle 2 gegenüberstellen.</text><rect x="40" y="365" width="590" height="169" rx="16" fill="#ffffff" stroke="#d3dee6" stroke-width="2"/><rect x="40" y="365" width="7" height="169" rx="3" fill="#aa7623"/><text x="64" y="406.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#18364c">Urteil</text><text x="64" y="448.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#466072">Stimmt / teilweise / falsch / offen – begründet.</text><rect x="650" y="365" width="590" height="169" rx="16" fill="#ffffff" stroke="#d3dee6" stroke-width="2"/><rect x="650" y="365" width="7" height="169" rx="3" fill="#aa7623"/><text x="674" y="406.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#18364c">Quellen</text><text x="674" y="448.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#466072">Beide Links, Fundstellen und Abrufdaten.</text><rect x="40" y="566" width="1200" height="92" rx="14" fill="#102e44"/><text x="62" y="597.8" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#a8d5d4">DARUM FUNKTIONIERT ES</text><text x="62" y="631.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#ffffff">Die Gestaltung macht Ihren Gedankengang überprüfbar.</text><text x="40" y="698.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#466072">Eigenes Beispiel · übertragen, ausprobieren, verbessern</text><text x="1020" y="698.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#466072">KI-Sprecherin · Deutsch</text></svg>