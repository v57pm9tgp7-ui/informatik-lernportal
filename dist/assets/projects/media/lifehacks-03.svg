<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img"><title>Tipp 2 · Einen Tab zurückholen</title><desc>Beispiel Chrome unter Windows: Öffnen und schliessen Sie eine harmlose Seite. Mit Strg, Umschalt und T öffnen Sie einen kürzlich geschlossenen Tab wieder.</desc><rect width="1280" height="720" fill="#eef3f7"/><rect x="0" y="0" width="1280" height="155" rx="0" fill="#102e44"/><text x="40" y="44.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#bfd7e5">MEDIENINFOLAB  /  Fünf Tricks, die bleiben</text><text x="1140" y="43.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#bfd7e5">03 / 08</text><text x="40" y="106.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="40" font-weight="700" fill="#ffffff">Tipp 2 · Einen Tab zurückholen</text><rect x="40" y="181" width="766" height="359" rx="16" fill="#ffffff" stroke="#c4d4e0" stroke-width="2"/><rect x="40" y="181" width="766" height="41" rx="16" fill="#dbe5ec"/><text x="62" y="207.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#466072">Beispielaufbau · kein App-Screenshot</text><text x="65" y="260.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#18364c">1 · Eine Übungsseite schliessen</text><rect x="65" y="283" width="700" height="57" rx="10" fill="#dce6ee"/><rect x="81" y="294" width="170" height="42" rx="8" fill="#ffffff"/><text x="97" y="323.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18364c">Aufträge</text><rect x="267" y="294" width="210" height="42" rx="8" fill="#f6e8e3"/><text x="283" y="323.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18364c">Projektseite  ×</text><text x="65" y="387.9" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#b15b47">2 · Strg + Umschalt + T</text><rect x="65" y="418" width="700" height="82" rx="10" fill="