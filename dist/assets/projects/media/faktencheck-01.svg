<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img"><title>Behauptung → Belege → Urteil</title><desc>Beginnen Sie mit einem überprüfbaren Satz. Lesen Sie zwei brauchbare Quellen verschiedener Organisationen. Das Urteil darf nur so weit gehen wie die Belege.</desc><rect width="1280" height="720" fill="#eef3f7"/><rect x="0" y="0" width="1280" height="155" rx="0" fill="#102e44"/><text x="40" y="44.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#bfd7e5">MEDIENINFOLAB  /  Echt oder Fake?</text><text x="1140" y="43.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#bfd7e5">01 / 07</text><text x="40" y="106.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="40" font-weight="700" fill="#ffffff">Behauptung → Belege → Urteil</text><rect x="40" y="181" width="386" height="359" rx="16" fill="#ffffff" stroke="#d3dee6" stroke-width="2"/><rect x="40" y="181" width="7" height="359" rx="3" fill="#aa7623"/><rect x="62" y="201" width="49" height="44" rx="12" fill="#aa7623"/><text x="72" y="230.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#ffffff">01</text><text x="64" y="284.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" fill="#18364c">Behauptung</text><text x="64" y="361.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400" fill="#466072">Was genau soll wahr</text><text x="64" y="395.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400" fill="#466072">sein?</text><rect x="447" y="181" width="386" height="359" rx="16" fill="#ffffff" stroke="#d3dee6" stroke-width="2"/><rect x="447" y="181" width="7" height="359" rx="3" fill="#aa7623"/><rect x="469" y="201" width="49" height="44" rx="12" fill="#aa7623"/><text x="479" y="230.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#ffffff">02</text><text x="471" y="284.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" fill="#18364c">Belege</text><text x="471" y="361.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400" fill="#466072">Was steht tatsächlich in</text><text x="471" y="395.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400" fill="#466072">Quelle 1 und Quelle 2?</text><rect x="854" y="181" width="386" height="359" rx="16" fill="#ffffff" stroke="#d3dee6" stroke-width="2"/><rect x="854" y="181" width="7" height="359" rx="3" fill="#aa7623"/><rect x="876" y="201" width="49" height="44" rx="12" fill="#aa7623"/><text x="886" y="230.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#ffffff">03</text><text x="878" y="284.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" fill="#18364c">Urteil</text><text x="878" y="361.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400" fill="#466072">Was folgt daraus – mit</text><text x="878" y="395.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400" fill="#466072">welcher Einschränkung?</text><rect x="40" y="566" width="1200" height="92" rx="14" fill="#102e44"/><text x="62" y="597.8" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#a8d5d4">DARUM FUNKTIONIERT ES</text><text x="62" y="631.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#ffffff">Zwei verlinkte Suchtreffer sind noch keine nachvollziehbare Prüfung.</text><text x="40" y="698.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#466072">Eigenes Beispiel · übertragen, ausprobieren, verbessern</text><text x="1058" y="698.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#466072">Ohne Sprecherstimme</text></svg>