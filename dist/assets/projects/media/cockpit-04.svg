<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img"><title>Beispiel 3 · Meine Lernwoche</title><desc>Ein Wochenplan wird nützlich, wenn grosse Vorhaben in kleine nächste Handlungen zerlegt sind. Die Termine hier sind Übungsangaben.</desc><rect width="1280" height="720" fill="#eef3f7"/><rect x="0" y="0" width="1280" height="155" rx="0" fill="#102e44"/><text x="40" y="44.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#bfd7e5">MEDIENINFOLAB  /  Mein digitales Cockpit</text><text x="1140" y="43.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#bfd7e5">04 / 07</text><text x="40" y="106.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="40" font-weight="700" fill="#ffffff">Beispiel 3 · Meine Lernwoche</text><rect x="40" y="181" width="590" height="169" rx="16" fill="#ffffff" stroke="#d3dee6" stroke-width="2"/><rect x="40" y="181" width="7" height="169" rx="3" fill="#187d72"/><text x="64" y="222.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#18364c">Diese Woche</text><text x="64" y="263.8" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#466072">5 Begriffe mit Beispielen notieren</text><text x="64" y="292.8" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#466072">PDF auf 3 Angaben prüfen</text><text x="64" y="320.8" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#466072">Eine offene Frage klären</text><rect x="650" y="181" width="590" height="169" rx="16" fill="#ffffff" stroke="#d3dee6" stroke-width="2"/><rect x="650" y="181" width="7" height="169" rx="3" fill="#187d72"/><text x="674" y="222.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#18364c">Termine · Übung</text><text x="674" y="264.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#466072">Dienstag · Selbsttest</text><text x="674" y="294.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#466072">Donnerstag · Fragen besprechen</text><rect x="40" y="365" width="590" height="169" rx="16" fill="#ffffff" stroke="#d3dee6" stroke-width="2"/><rect x="40" y="365" width="7" height="169" rx="3" fill="#187d72"/><text x="64" y="406.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#18364c">Direkt öffnen</text><text x="64" y="447.8" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#466072">Lernnotizen</text><text x="64" y="476.8" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#466072">Übungsdossier</text><text x="64" y="504.8" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#466072">Aufgabenübersicht</text><rect x="650" y="365" width="590" height="169" rx="16" fill="#ffffff" stroke="#d3dee6" stroke-width="2"/><rect x="650" y="365" width="7" height="169" rx="3" fill="#187d72"/><text x="674" y="406.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#18364c">Mein Ziel</text><text x="674" y="448.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#466072">Die fünf Begriffe am Donnerstag ohne</text><text x="674" y="478.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#466072">Nachschlagen erklären.</text><rect x="40" y="566" width="1200" height="92" rx="14" fill="#102e44"/><text x="62" y="597.8" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#a8d5d4">DARUM FUNKTIONIERT ES</text><text x="62" y="631.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#ffffff">Das Ziel lässt sich prüfen; der erste Schritt ist klein genug.</text><text x="40" y="698.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#466072">Eigenes Beispiel · übertragen, ausprobieren, verbessern</text><text x="1058" y="698.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#466072">Ohne Sprecherstimme</text></svg>