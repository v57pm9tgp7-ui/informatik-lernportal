ffff">Zeigen Sie im eigenen Bild den Suchbegriff und einen Treffer.</text><text x="40" y="698.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#466072">Eigenes Beispiel · übertragen, ausprobieren, verbessern</text><text x="1058" y="698.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#466072">Ohne Sprecherstimme</text></svg>