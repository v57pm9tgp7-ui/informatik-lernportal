<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img"><title>Tipp 1 · Auf einer Seite suchen</title><desc>Beispiel Chrome unter Windows: Strg und F öffnet die Suche auf der aktuellen Seite. Geben Sie einen vorhandenen Begriff ein und prüfen Sie den markierten Treffer.</desc><rect width="1280" height="720" fill="#eef3f7"/><rect x="0" y="0" width="1280" height="155" rx="0" fill="#102e44"/><text x="40" y="44.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#bfd7e5">MEDIENINFOLAB  /  Fünf Tricks, die bleiben</text><text x="1140" y="43.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#bfd7e5">02 / 08</text><text x="40" y="106.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="40" font-weight="700" fill="#ffffff">Tipp 1 · Auf einer Seite suchen</text><rect x="40" y="181" width="766" height="359" rx="16" fill="#ffffff" stroke="#c4d4e0" stroke-width="2"/><rect x="40" y="181" width="766" height="41" rx="16" fill="#dbe5ec"/><text x="62" y="207.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#466072">Beispielaufbau · kein App-Screenshot</text><rect x="62" y="243" width="721" height="47" rx="7" fill="#edf3f8"/><text x="79" y="275.8" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#b15b47">Strg + F</text><rect x="482" y="251" width="279" height="31" rx="6" fill="#ffffff" stroke="#a9bfce" stroke-width="1"/><text x="498" y="273.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#18364c">Abgabe</text><text x="694" y="273.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#466072">1 / 1</text><text x="76" y="346.7" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#18364c">Mein Projekt · Termine</text><text x="76" y="401.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#466072">Zwisc